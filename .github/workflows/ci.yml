name: CI

on:
      pull_request:
      push:
            branches: [main, dev]

concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

jobs:
      check:
            runs-on: ubuntu-latest
            timeout-minutes: 15
            steps:
                  - uses: actions/checkout@v4
                  - uses: actions/setup-node@v4
                    with:
                          node-version: 22
                          cache: npm
                  - run: npm ci --no-audit --no-fund
                  - name: Formatting
                    run: npm run format:check
                  - name: Types
                    run: npm run typecheck
                  - name: Tests
                    run: npm test
                  # main is what the server deploys (auto-update every 30 min): a broken build must never reach it
                  - name: Build
                    run: npm run build
