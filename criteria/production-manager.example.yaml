# Example for Jobvision job post 1606152 (مدیر تولید). Rename to production-manager.yaml and edit.
name: production-manager
match:
      jobIds: ['1606152']
threshold: 70
mustHave: ['مدیریت تولید', 'برنامه ریزی تولید', 'کنترل کیفیت']
