# Copy to sources.yaml (git-ignored) and fill in from DevTools > Network.
# ${VAR} is replaced from .env. {page} in list.url/body is the page number. {id} or any item field
# can be used in resumeUrlTemplate / profileUrlTemplate.
# After editing, run:  npm run probe -- jobinja    to see the raw JSON and how fields map.

sources:
  - name: jobinja
    type: http
    enabled: false              # set true once filled in
    baseUrl: https://jobinja.ir
    headers:
      Cookie: "${JOBINJA_COOKIE}"
      Authorization: "${JOBINJA_TOKEN}"
      Accept: application/json
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
    delayMs: 1500               # pause between requests, keep it human-like
    list:
      url: "/REPLACE/with/the/applications/endpoint?page={page}"
      method: GET
      itemsPath: data           # where the array of applicants is in the JSON (e.g. data.items)
      maxPages: 3
    fields:                     # dotted paths inside ONE applicant item
      id: id
      name: full_name
      jobId: job.id
      jobTitle: job.title
      appliedAt: created_at
      resumeUrl: resume_url     # or use resumeUrlTemplate below
      # resumeText: resume.text # if the API returns resume text inline
      extra: {}                 # e.g. { city: city, expectedSalary: salary } - passed to the scorer
    # resumeUrlTemplate: "/REPLACE/applications/{id}/resume"
    # profileUrlTemplate: "https://jobinja.ir/REPLACE/applications/{id}"

  - name: jobvision
    type: http
    enabled: false
    baseUrl: https://employer.jobvision.ir
    headers:
      Cookie: "${JOBVISION_COOKIE}"
      Authorization: "${JOBVISION_TOKEN}"
      Accept: application/json
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
    list:
      url: "/REPLACE/with/the/applications/endpoint"
      method: POST
      body: { pageIndex: "{page}", pageSize: 20 }
      itemsPath: data.items
      maxPages: 3
    fields:
      id: id
      name: fullName
      jobId: jobPostId
      jobTitle: jobTitle
      resumeUrl: resumeFileUrl

  # Local test source: samples/<job title>/<resume>.pdf|docx|txt
  - name: samples
    type: folder
    enabled: false
    dir: samples
